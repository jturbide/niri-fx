name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: ruff check . && ruff format --check .
      - run: npm run lint && npm run format:check

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install GLSL validator and package builder
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python -m pip install -r requirements-dev.txt
      - name: Test registry safety and effect generation
        run: python -m unittest discover -s tests -v
      - name: Check documentation, media and changelog
        run: python scripts/check-docs.py
      - name: Compile all shader variants
        run: python scripts/validate.py --require-glsl
      - name: Build and smoke-test installed package
        run: |
          python -m build
          python -m venv /tmp/niri-fx-package
          /tmp/niri-fx-package/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/niri-fx-package/bin/niri-fx render --preset balanced > fragments.kdl
          /tmp/niri-fx-package/bin/niri-fx preview --output fragments.html
          /tmp/niri-fx-package/bin/niri-fx render --preset diagonal-shear > slices.kdl
          /tmp/niri-fx-package/bin/python -m niri_fx --version
          /tmp/niri-fx-package/bin/python -c "from importlib import metadata, resources, util; assert util.find_spec('niri_fragments') is None; assert [e.name for e in metadata.distribution('niri-fx').entry_points] == ['niri-fx']; assert b'<svg' in resources.files('niri_fx').joinpath('assets/niri-fx.svg').read_bytes()"
          /tmp/niri-fx-package/bin/niri-fx render --preset spring-wobble > elastic.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset crosswind > varied.kdl
          /tmp/niri-fx-package/bin/niri-fx export-pack --output /tmp/nirifx-pack --state /tmp/nirifx-pack-state --apply
          /tmp/niri-fx-package/bin/niri-fx restore --state /tmp/nirifx-pack-state --apply

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Test Studio rendering, import and real save flow
        env:
          CHROME_BIN: google-chrome
        run: python scripts/studio-e2e.py
