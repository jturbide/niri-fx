name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      renderer: ${{ steps.scope.outputs.renderer }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_REF: ${{ github.head_ref || github.ref }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          python3 scripts/ci_scope.py --base "$BASE_SHA" --head "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --ref "$SOURCE_REF"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: ruff check . && ruff format --check .
      - run: npm run lint && npm run format:check
      - run: npm test

  validate:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - name: Require successful check selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          FULL_CHECKS: ${{ needs.changes.outputs.full }}
          RENDER_CHECKS: ${{ needs.changes.outputs.renderer }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$FULL_CHECKS" == true || "$FULL_CHECKS" == false ]]
          [[ "$RENDER_CHECKS" == true || "$RENDER_CHECKS" == false ]]
          [[ "$FULL_CHECKS" == true || "$RENDER_CHECKS" == false ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies and package builder
        if: needs.changes.outputs.full == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Install GLSL validator
        if: needs.changes.outputs.renderer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Test registry safety and effect generation
        if: needs.changes.outputs.full == 'true'
        run: python -m unittest discover -s tests -v
      - name: Check documentation, media and changelog
        run: python scripts/check-docs.py
      - name: Build the static gallery and Studio
        run: python scripts/build-site.py --output "$RUNNER_TEMP/nirifx-site"
      - name: Compile all shader variants
        if: needs.changes.outputs.renderer == 'true'
        run: python scripts/validate.py --require-glsl
      - name: Build and smoke-test installed package
        if: needs.changes.outputs.full == 'true'
        run: |
          python -m build
          python -m venv /tmp/niri-fx-package
          /tmp/niri-fx-package/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/niri-fx-package/bin/niri-fx render --preset balanced > fragments.kdl
          /tmp/niri-fx-package/bin/niri-fx preview --output fragments.html
          /tmp/niri-fx-package/bin/niri-fx render --preset diagonal-shear > slices.kdl
          /tmp/niri-fx-package/bin/python -m niri_fx --version
          /tmp/niri-fx-package/bin/niri-fx list --text --recommended
          /tmp/niri-fx-package/bin/niri-fx list --profiles --text
          /tmp/niri-fx-package/bin/niri-fx list --documents > catalog.json
          /tmp/niri-fx-package/bin/niri-fx list --summary --recommended > catalog-summary.json
          /tmp/niri-fx-package/bin/niri-fx agent-info > agent-info.json
          /tmp/niri-fx-package/bin/niri-fx agent-info --parameters > agent-parameters.json
          /tmp/niri-fx-package/bin/niri-fx agent-info --skill > agent-skill.md
          /tmp/niri-fx-package/bin/python -c "from pathlib import Path; import json; assert json.loads(Path('agent-info.json').read_text())['schema'] == 1; assert json.loads(Path('agent-parameters.json').read_text())['pointer']['integer'] == ['damping', 'frequency']; assert 'name: nirifx' in Path('agent-skill.md').read_text()"
          /tmp/niri-fx-package/bin/niri-fx inspect --profile fragment-flow > builtin-profile.json
          /tmp/niri-fx-package/bin/niri-fx render --profile burst-and-drift > builtin-profile.kdl
          /tmp/niri-fx-package/bin/niri-fx picker --qml-dir
          /tmp/niri-fx-package/bin/niri-fx picker --gtk-dir
          /tmp/niri-fx-package/bin/python -c "from niri_fx.picker import qml_directory; assert all((qml_directory() / name).is_file() for name in ('shell.qml', 'NiriFXController.qml', 'NiriFXPicker.qml'))"
          /tmp/niri-fx-package/bin/python -c "from niri_fx.picker import gtk_directory; assert all((gtk_directory() / name).is_file() for name in ('app.mjs', 'picker.mjs', 'controller.mjs', 'transport.mjs', 'picker.css'))"
          /tmp/niri-fx-package/bin/python -c "from importlib import metadata, resources, util; assert util.find_spec('niri_fragments') is None; assert [e.name for e in metadata.distribution('niri-fx').entry_points] == ['niri-fx']; assert b'<svg' in resources.files('niri_fx').joinpath('assets/niri-fx.svg').read_bytes()"
          /tmp/niri-fx-package/bin/niri-fx render --preset spring-wobble > elastic.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset crosswind > varied.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset noise-dissolve > dissolve.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset iris-bloom > iris.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset dust-drift > pixels.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset ghost-wisps > wisps.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset shockwave > distortion.kdl
          /tmp/niri-fx-package/bin/niri-fx render --preset hexagon-burst > hexagons.kdl
          /tmp/niri-fx-package/bin/niri-fx profile --open-preset spring-wobble --close-preset ember-erosion > profile.json
          /tmp/niri-fx-package/bin/niri-fx render --custom profile.json > profile.kdl
          /tmp/niri-fx-package/bin/niri-fx inspect --custom profile.json > inspected-profile.json
          /tmp/niri-fx-package/bin/niri-fx preview --custom profile.json --output profile.html
          /tmp/niri-fx-package/bin/niri-fx profile --open-preset balanced --close-preset balanced --pointer gentle > pointer-profile.json
          /tmp/niri-fx-package/bin/niri-fx render --custom pointer-profile.json > pointer-stock.kdl
          /tmp/niri-fx-package/bin/python -c "from pathlib import Path; import json; assert json.loads(Path('pointer-profile.json').read_text())['pointer']['strength'] == 0.4; assert 'pointer-wobble' not in Path('pointer-stock.kdl').read_text()"
          /tmp/niri-fx-package/bin/niri-fx profile --action-set fragments-motion --include-resize --include-movement > action-set.json
          /tmp/niri-fx-package/bin/niri-fx render --custom action-set.json > action-set.kdl
          /tmp/niri-fx-package/bin/python -c "from pathlib import Path; p = Path('action-set.kdl').read_text(); assert 'window-resize' in p and 'window-movement' not in p and 'workspace-switch' in p"
          /tmp/niri-fx-package/bin/niri-fx export-pack --output /tmp/nirifx-pack --state /tmp/nirifx-pack-state --apply
          /tmp/niri-fx-package/bin/niri-fx restore --state /tmp/nirifx-pack-state --apply

  browser:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful check selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          FULL_CHECKS: ${{ needs.changes.outputs.full }}
          RENDER_CHECKS: ${{ needs.changes.outputs.renderer }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$FULL_CHECKS" == true || "$FULL_CHECKS" == false ]]
          [[ "$RENDER_CHECKS" == true || "$RENDER_CHECKS" == false ]]
          [[ "$FULL_CHECKS" == true || "$RENDER_CHECKS" == false ]]
      - if: needs.changes.outputs.renderer == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: needs.changes.outputs.renderer == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - if: needs.changes.outputs.renderer == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Test Studio rendering, import and real save flow
        if: needs.changes.outputs.renderer == 'true'
        env:
          CHROME_BIN: google-chrome
        run: |
          node --version
          "$CHROME_BIN" --version
          npm run test:browser
          python scripts/studio-e2e.py
      - name: Explain skipped browser checks
        if: needs.changes.outputs.renderer == 'false'
        run: echo "Only known documentation, native or agent paths changed; portable rendering and Studio E2E were not needed. See check selection for retained checks." >> "$GITHUB_STEP_SUMMARY"
