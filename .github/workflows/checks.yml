name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install GLSL validator and package builder
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python -m pip install build
      - name: Test registry safety and effect generation
        run: python -m unittest discover -s tests -v
      - name: Check documentation, media and changelog
        run: python scripts/check-docs.py
      - name: Compile all shader variants
        run: python scripts/validate.py --require-glsl
      - name: Build and smoke-test installed package
        run: |
          python -m build
          python -m venv /tmp/niri-fragments-package
          /tmp/niri-fragments-package/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/niri-fragments-package/bin/niri-fragments render --preset balanced > fragments.kdl
          /tmp/niri-fragments-package/bin/niri-fragments preview --output fragments.html
          /tmp/niri-fragments-package/bin/niri-fx render --preset diagonal-shear > slices.kdl
          /tmp/niri-fragments-package/bin/niri-fragments render --preset diagonal-shear > slices-legacy.kdl
          cmp slices.kdl slices-legacy.kdl
          /tmp/niri-fragments-package/bin/python -m niri_fx --version

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test Studio rendering, parity and JSON import
        env:
          CHROME_BIN: google-chrome
        run: |
          python -m niri_fragments preview --output /tmp/fragments-browser.html
          node scripts/browser-smoke.mjs file:///tmp/fragments-browser.html
