name: Arch package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "niri_fx/__init__.py"
      - "niri_fx/native_*.py"
      - "niri_fx/package_session.py"
      - "experimental/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "scripts/build-nirifx-session.py"
      - "scripts/build-niri-movement.py"
      - "scripts/lib/native_*.py"
      - "scripts/lib/arch_session_acceptance.py"
      - "scripts/check-arch*.py"
      - "scripts/test-arch*.sh"
      - "tests/test_arch*.py"
      - "tests/test_native*.py"
      - "tests/test_experimental_build.py"
      - ".github/workflows/arch-package.yml"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "niri_fx/__init__.py"
      - "niri_fx/native_*.py"
      - "niri_fx/package_session.py"
      - "experimental/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "scripts/build-nirifx-session.py"
      - "scripts/build-niri-movement.py"
      - "scripts/lib/native_*.py"
      - "scripts/lib/arch_session_acceptance.py"
      - "scripts/check-arch*.py"
      - "scripts/test-arch*.sh"
      - "tests/test_arch*.py"
      - "tests/test_native*.py"
      - "tests/test_experimental_build.py"
      - ".github/workflows/arch-package.yml"

permissions:
  contents: read

concurrency:
  group: arch-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Arch ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [niri-fx, niri-fx-git]
    container:
      image: docker.io/library/archlinux:base-devel@sha256:aecf5b39bd3139a951090dfb3d940f9317e4c5fca038c65fb49ac03910f7133e
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Git in the disposable container
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test the complete candidate package
        env:
          NIRIFX_ARCH_PACKAGE_CONTAINER: "1"
          PACKAGE_NAME: ${{ matrix.package }}
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/test-arch-package.sh "$GITHUB_WORKSPACE/artifacts/arch-package/$PACKAGE_NAME" "$PACKAGE_NAME"
      - name: Retain package acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package-${{ matrix.package }}-acceptance
          path: artifacts/arch-package/${{ matrix.package }}/
          retention-days: 7
          if-no-files-found: warn
