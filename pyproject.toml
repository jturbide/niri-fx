[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niri-fx"
version = "0.6.0"
description = "Fragment, slice and elastic window animations for niri, with a visual Studio, CLI and optional shell integrations."
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md", "experimental/COPYING-NIRI"]
authors = [{name = "Julien Turbide"}]
readme = "README.md"
dependencies = []
keywords = [
    "niri", "wayland", "linux", "shaders", "glsl", "webgl", "animations",
    "window-effects", "fragments", "pixels", "particles", "slices", "wobble",
    "inir", "iris", "quickshell", "dank", "dankmaterialshell", "dms", "noctalia",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/jturbide/niri-fx"
Documentation = "https://github.com/jturbide/niri-fx/blob/main/docs/README.md"
Changelog = "https://github.com/jturbide/niri-fx/blob/main/CHANGELOG.md"
Issues = "https://github.com/jturbide/niri-fx/issues"
Source = "https://github.com/jturbide/niri-fx"

[project.scripts]
niri-fx = "niri_fx.cli:main"

[tool.setuptools.packages.find]
include = ["niri_fx*"]

[tool.setuptools.package-data]
niri_fx = ["shaders/*.glsl", "preview.html", "*.js", "*.css", "assets/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"] # Source-checkout tools add the repository root to sys.path.
