[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niri-fx"
version = "0.6.0"
description = "Custom window animations for Niri, with a visual studio and desktop shell integrations."
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md", "experimental/COPYING-NIRI"]
authors = [{name = "Julien Turbide"}]
readme = "README.md"
dependencies = []
keywords = ["niri", "wayland", "shaders", "animation", "particles", "inir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/jturbide/niri-fx"
Documentation = "https://github.com/jturbide/niri-fx/blob/main/docs/README.md"
Changelog = "https://github.com/jturbide/niri-fx/blob/main/CHANGELOG.md"
Issues = "https://github.com/jturbide/niri-fx/issues"
Source = "https://github.com/jturbide/niri-fx"

[project.scripts]
niri-fx = "niri_fragments.cli:main"
niri-fragments = "niri_fragments.cli:main"

[tool.setuptools.packages.find]
include = ["niri_fragments*", "niri_fx*"]

[tool.setuptools.package-data]
niri_fragments = ["shaders/*.glsl", "preview.html", "motion-preview.js"]
