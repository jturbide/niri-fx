[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niri-fragments"
version = "0.4.0"
description = "Pixel deconstruction and reconstruction animations for Niri, with iNiR/iRiS presets."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Julien Turbide"}]
readme = "README.md"
dependencies = []

[project.scripts]
niri-fragments = "niri_fragments.cli:main"

[tool.setuptools.packages.find]
include = ["niri_fragments*"]

[tool.setuptools.package-data]
niri_fragments = ["shaders/*.glsl", "preview.html", "motion-preview.js"]
